<article class="task-card" [style.borderLeftColor]="priorityColor()">
  <div class="task-card-body">
    <div class="task-card-top">
      <span class="badge badge-{{ task().status.toLowerCase() }}">
        {{ statusLabel() }}
      </span>
      <span class="badge badge-{{ task().priority.toLowerCase() }}">
        {{ task().priority }}
      </span>
    </div>
    <a [routerLink]="['/', task().id]" class="task-title">{{ task().title }}</a>
    @if (task().description) {
      <p class="task-description">{{ task().description | slice:0:120 }}{{ task().description.length > 120 ? '...' : '' }}</p>
    }
    <div class="task-card-footer">
      <span class="task-date">{{ task().createdAt | date:'dd/MM/yyyy' }}</span>
      <div class="task-actions">
        <button class="btn btn-ghost btn-sm" (click)="edit.emit(task())" title="Editar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
        </button>
        <button class="btn btn-ghost btn-sm btn-delete" (click)="delete.emit(task())" title="Deletar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>
  </div>
</article>
