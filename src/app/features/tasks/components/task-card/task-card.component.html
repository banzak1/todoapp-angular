<div class="group flex flex-col md:flex-row md:items-center gap-4 p-4 rounded-xl bg-surface-container-lowest border border-outline-variant/20 shadow-sm hover:shadow-md transition-all duration-200 relative overflow-hidden">
  <div class="absolute left-0 top-0 bottom-0 w-1" [ngClass]="{
    'bg-error': task().priority === 'HIGH',
    'bg-warning': task().priority === 'MEDIUM',
    'bg-success': task().priority === 'LOW'
  }"></div>
  <div class="flex items-start md:items-center gap-4 w-full">
    <div class="mt-1 md:mt-0">
      <input type="checkbox" class="w-5 h-5 rounded-full border-outline text-primary focus:ring-primary cursor-pointer" [checked]="task().status === 'DONE'" />
    </div>
    <div class="flex-1 min-w-0">
      <a [routerLink]="['/', task().id]" class="font-body-md text-[14px] text-on-background font-medium truncate hover:underline block">{{ task().title }}</a>
      <div class="flex flex-wrap items-center gap-3 mt-2 md:mt-1">
        <span class="font-label-sm text-[12px] px-2.5 py-1 rounded-full text-on-surface-variant bg-surface-variant font-medium">
          {{ statusLabel() }}
        </span>
        <span class="font-label-sm text-[12px] text-on-surface-variant flex items-center gap-1">
          <span class="material-symbols-outlined text-[14px]">schedule</span> 
          {{ task().createdAt | date:'shortDate' }}
        </span>
      </div>
    </div>
    
    <div class="hidden md:flex items-center gap-2">
      <button class="text-on-surface-variant hover:text-primary transition-colors p-1" (click)="edit.emit(task())" title="Editar">
        <span class="material-symbols-outlined">edit</span>
      </button>
      <button class="text-error hover:text-error transition-colors p-1" (click)="delete.emit(task())" title="Deletar">
        <span class="material-symbols-outlined">delete</span>
      </button>
    </div>
  </div>

  <!-- Mobile Footer -->
  <div class="flex md:hidden items-center justify-end mt-2 pt-2 border-t border-outline-variant/10">
      <button class="text-on-surface-variant hover:text-primary transition-colors p-1" (click)="edit.emit(task())" title="Editar">
        <span class="material-symbols-outlined">edit</span>
      </button>
      <button class="text-error hover:text-error transition-colors p-1" (click)="delete.emit(task())" title="Deletar">
        <span class="material-symbols-outlined">delete</span>
      </button>
  </div>
</div>
