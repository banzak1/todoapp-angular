<div class="page">
  <div class="container">
    <div class="page-header">
      <h1 class="page-title">Tarefas</h1>
      <a routerLink="/new" class="btn btn-primary">+ Nova Tarefa</a>
    </div>

    <app-task-filters (filterChange)="onFilterChange($event)" />

    @if (loading()) {
      <app-loading message="Carregando tarefas..." />
    } @else if (error()) {
      <app-empty-state iconSvg='<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' title="Erro ao carregar" message="Não foi possível carregar as tarefas.">
        <button class="btn btn-primary mt-md" (click)="loadTasks()">Tentar novamente</button>
      </app-empty-state>
    } @else if (tasks().length === 0) {
      <app-empty-state iconSvg='<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>' title="Nenhuma tarefa" message="Você ainda não tem tarefas. Crie sua primeira tarefa!">
        <a routerLink="/new" class="btn btn-primary mt-md">Criar Tarefa</a>
      </app-empty-state>
    } @else {
      <div class="task-grid">
        @for (task of tasks(); track task.id) {
          <app-task-card
            [task]="task"
            (edit)="onEdit($event)"
            (delete)="onDelete($event)"
          />
        }
      </div>

      <app-pagination
        [currentPage]="currentPage()"
        [totalPages]="totalPages()"
        (pageChange)="onPageChange($event)"
      />
    }
  </div>
</div>

<app-confirm-dialog #confirmDialog />
