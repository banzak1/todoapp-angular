<div class="empty-state">
  @if (safeSvg(); as svg) {
    <div class="empty-icon" [innerHTML]="svg"></div>
  } @else {
    <div class="empty-icon">{{ icon() }}</div>
  }
  <h3 class="empty-title">{{ title() }}</h3>
  @if (message()) {
    <p class="empty-message">{{ message() }}</p>
  }
  <ng-content />
</div>
